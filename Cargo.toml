[package]
name = "vacationplanner2ics"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A small Vacationplanner to iCalendar subscription service"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "query", "tokio"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
icalendar = { version = "0.17.13", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }

[profile.release]
lto = "thin"
strip = true

name: vacationplanner2ics

services:
  app:
    image: ${IMAGE:-code.popov.link/valentineus/vacationplanner2ics:latest}
    pull_policy: always
    network_mode: host
    environment:
      BIND_ADDR: 127.0.0.1:${HTTP_PORT:-8080}
      API_URL: ${API_URL:-https://api.vacationplanner.ru}
      UPSTREAM_TIMEOUT_SECONDS: ${UPSTREAM_TIMEOUT_SECONDS:-15}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 65s

  dev:
    profiles: [dev]
    image: rust:1.99.0-bookworm
    working_dir: /workspace
    command: sleep infinity
    init: true
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/workspace/target
    ports:
      - "127.0.0.1:8080:8080"

  test:
    profiles: [test]
    build:
      context: .
      target: test
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  cargo-registry:
  cargo-target:
